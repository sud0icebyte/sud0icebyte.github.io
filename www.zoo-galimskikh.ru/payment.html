<html>
    <title>Оплата Онлайн</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/payment-fav.png" type="image/x-icon">
    <body text="ffffff">
        <h1 style="padding-top: 60px; text-align: center;">Оплата вашего билета</h1>
        <form action="payment_done.html" method="get" class="payment">
             <label for="card-number">Номер карты:</label>
             <input type="text" id="card-number" name="card-number" placeholder="0000 0000 0000 0000" maxlength="19" required>
             <label for="card-name">Имя держателя карты:</label>
             <input type="text" id="card-name" name="card-name" placeholder="VICTOR PETROV" required>
             <label for="card-date">Срок действия:</label>
             <input type="text" id="card-date" name="card-date" placeholder="ММ/ГГ" maxlength="5" required>
             <label for="card-cvv">CVV:</label>
             <input type="password" id="card-cvv" name="card-cvv" placeholder="***" maxlength="3" required>
              <button type="submit" class="payment-button">Оплатить</button>
        </form>
        <hr>
        <div class="info-bottom">
          <p>Все права защищены © 2026 год | www.zoo-galimskikh.ru | Сайт создан Галимских Иваном | e-mail: ivan.galimskikh@gmail.com</p>
        </div>
    </body>
</html>
